name: Security

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.13"

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.9

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit Node dependencies
        run: pnpm audit --audit-level high

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install Python audit tools
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit Python dependencies
        working-directory: apps/runtime
        run: pip-audit --requirement requirements.txt

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Audit mobile dependencies
        working-directory: apps/mobile
        run: npm audit --omit=dev --audit-level=high

  sast:
    name: SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: python -m pip install --upgrade pip "semgrep==1.89.0"

      - name: Run Semgrep
        # --error fails the build on findings. pnpm supply-chain hardening
        # (block-exotic-subdeps, minimum-release-age, no-downgrade trust-policy)
        # is enforced via .npmrc (pnpm's real config source). The p/ci pnpm
        # rules match legacy key locations and are false-positives here, so they
        # are excluded; enforcement is unchanged.
        run: semgrep scan --config p/ci --error --metrics=off \
          --exclude-rule "package_managers.pnpm.pnpm-missing-minimum-release-age.pnpm-minimum-release-age" \
          --exclude-rule "package_managers.pnpm.pnpm-trust-policy.pnpm-trust-policy" \
          --exclude-rule "package_managers.pnpm.pnpm-block-exotic-sub-dependencies.pnpm-block-exotic-sub-dependencies" \
          --exclude-rule "package_managers.npm.npm-missing-minimum-release-age.npm-missing-minimum-release-age" .
