name: Security

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.13"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit Node dependencies
        run: pnpm audit --audit-level high

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python audit tools
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit Python dependencies
        working-directory: apps/runtime
        run: pip-audit --requirement requirements.txt

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Audit mobile dependencies
        working-directory: apps/mobile
        run: npm audit --omit=dev --audit-level=high

  sast:
    name: SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: python -m pip install --upgrade pip "semgrep==1.89.0"

      - name: Run Semgrep
        # --error fails the build on findings; .semgrepignore (created by executor
        # 2026-07-19) suppresses known false positives in test fixtures/generics.
        run: semgrep scan --config p/ci --error --metrics=off --no-suppress-errors .
