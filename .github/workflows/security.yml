name: Security

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0.0.7.0.0
        with:
          node-version: "22.13"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.0.0
        with:
          version: 9.15.9

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit Node dependencies
        run: pnpm audit --audit-level high

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v5.3.0
        with:
          python-version: "3.11"

      - name: Install Python audit tools
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit Python dependencies
        working-directory: apps/runtime
        run: pip-audit --requirement requirements.txt

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Audit mobile dependencies
        working-directory: apps/mobile
        run: npm audit --omit=dev --audit-level=high

  sast:
    name: SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2

      - name: Run Semgrep
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1.89.0
        with:
          config: p/ci
          version: "1.89.0"
          extraArgs: >
            --error
            --metrics=off
            --exclude-rule "package_managers.pnpm.pnpm-missing-minimum-release-age.pnpm-minimum-release-age"
            --exclude-rule "package_managers.pnpm.pnpm-trust-policy.pnpm-trust-policy"
            --exclude-rule "package_managers.pnpm.pnpm-block-exotic-sub-dependencies.pnpm-block-exotic-sub-dependencies"
            --exclude-rule "package_managers.npm.npm-missing-minimum-release-age.npm-missing-minimum-release-age"
        env:
          SEMGREP_SEND_METRICS: "off"
