name: Tests & Codegen Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4.2.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@a3252b78dba8afc09747ad794d6cb9aa5331c5a6 # v4.0.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.0.4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type-check
        run: pnpm type-check

      - name: Run lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4.2.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@a3252b78dba8afc09747ad794d6cb9aa5331c5a6 # v4.0.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.0.4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run schema codegen
        run: pnpm --filter @flowos/schema codegen

      - name: Run Python codegen
        run: |
          cd apps/runtime
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python scripts/codegen.py

      - name: Check for schema drift
        run: |
          git diff --exit-code -- packages/schema/generated/schema.json apps/runtime/generated/models.py packages/schema/generated/types.ts
        # If this fails, schema drift detected - run 'pnpm codegen' locally and commit changes