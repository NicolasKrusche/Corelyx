name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (type-check + lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check @flowos/schema
        run: pnpm --filter @flowos/schema type-check

      - name: Type-check @flowos/db
        run: pnpm --filter @flowos/db type-check

      - name: Type-check @flowos/web
        run: pnpm --filter @flowos/web exec tsc --noEmit --incremental false

      - name: Run web tests
        run: pnpm --filter @flowos/web test

      - name: Lint web
        run: pnpm --filter @flowos/web lint

      - name: Build web
        run: pnpm --filter @flowos/web build

  runtime:
    name: Runtime (lint + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/runtime/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-xdist ruff

      - name: Lint runtime
        run: ruff check .

      - name: Run runtime tests
        run: python -m pytest tests -n auto --dist worksteal

  mobile:
    name: Mobile (type-check + lint + doctor + export)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check mobile
        run: npm run type-check

      - name: Lint mobile
        run: npm run lint

      - name: Validate Expo project
        run: npx expo-doctor

      - name: Export Android bundle
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/corelyx-mobile-export"

  desktop:
    name: Desktop (format + clippy + test)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run desktop tests
        run: cargo test --all-targets
