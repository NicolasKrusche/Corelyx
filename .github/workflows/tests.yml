name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (type-check + vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check @flowos/schema
        run: pnpm --filter @flowos/schema type-check

      - name: Type-check @flowos/db
        run: pnpm --filter @flowos/db type-check

      - name: Type-check @flowos/web
        run: pnpm --filter @flowos/web exec tsc --noEmit --incremental false

      - name: Run web tests
        run: pnpm --filter @flowos/web test

  runtime:
    name: Runtime (unittest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/runtime/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run runtime tests
        run: python -m unittest discover -s tests -p "test_*.py"
