# Corelyx Dependabot config (Task #1: GitHub Governance, Schritt 5)
# Enables security alerts + auto-triage (low/medium) + auto-merge for patch/minor with green CI

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Supply-chain cooldown: wait before opening PRs (matches .npmrc minimum-release-age)
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    # pnpm supply-chain hardening (mirrors .npmrc): require packages to be
    # published >= 7 days before install.
    allow:
      - dependency-type: "direct"
    # Auto-merge patch + minor versions when CI is green
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/apps/runtime"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "github-actions"
