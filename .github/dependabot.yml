# Corelyx Dependabot config
# Groups updates into: actions, python-patch, npm-patch

version: 2
updates:
  # GitHub Actions ecosystem
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  # Python ecosystem (apps/runtime)
  - package-ecosystem: "pip"
    directory: "/apps/runtime"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "python"
    groups:
      python-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
    cooldown:
      default-days: 7

  # npm ecosystem (monorepo root)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "npm"
    open-pull-requests-limit: 10
    allow:
      - dependency-type: "direct"
    groups:
      npm-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
    cooldown:
      default-days: 7
