packages:
  - "apps/*"
  - "!apps/runtime"
  # apps/desktop is a Tauri (Rust) app with its own toolchain and release cadence.
  # It stays in the monorepo for atomic schema/runtime/web/desktop PRs, but is kept
  # out of the JS workspace install/CI — same precedent as apps/runtime (Python).
  - "!apps/desktop"
  # apps/mobile is an Expo (React Native) app. Metro's module resolution fights
  # pnpm workspace symlink hoisting, and the app talks to the web app over HTTP
  # (no compile-time coupling to packages/schema), so it manages its own deps and
  # stays out of the JS workspace/CI — same precedent as apps/desktop.
  - "!apps/mobile"
  - "packages/*"

# pnpm supply-chain hardening (mirrors .npmrc). Read by pnpm v10 + Semgrep p/ci.
# NOTE: pnpm v10 reads these as TOP-LEVEL settings in pnpm-workspace.yaml
# (NOT nested under a `pnpm:` key). Semgrep p/ci also anchors on top-level keys.
blockExoticSubdeps: true
minimumReleaseAge: 10080
trustPolicy: no-downgrade

overrides:
  "@typescript-eslint/parser": "^8.59.1"
  "minimatch@>=9.0.0 <9.0.7": "9.0.7"
  "postcss": "^8.5.12"
  "protobufjs": ">=8.6.0"
  "ws": ">=8.20.1"
  "brace-expansion": ">=5.0.6"
  "@grpc/grpc-js": ">=1.14.4"
  "js-cookie": ">=3.0.7"
  "form-data": ">=4.0.6"
  "@opentelemetry/core": ">=2.8.0"
  "@opentelemetry/propagator-jaeger": ">=2.9.0"
  "js-yaml": ">=4.2.0"
  "esbuild": ">=0.28.1"
  "@opentelemetry/auto-instrumentations-node": ">=0.75.0"
  "@opentelemetry/sdk-node": ">=0.217.0"
  "@opentelemetry/exporter-prometheus": ">=0.217.0"
  "sharp": ">=0.35.0"
