apiVersion: v1
kind: Service
metadata:
  name: {{ include "corelyx.fullname" . }}-web
  labels:
    {{- include "corelyx.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "corelyx.web.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "corelyx.fullname" . }}-runtime
  labels:
    {{- include "corelyx.labels" . | nindent 4 }}
    app.kubernetes.io/component: runtime
spec:
  type: {{ .Values.runtime.service.type }}
  ports:
    - port: {{ .Values.runtime.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "corelyx.runtime.selectorLabels" . | nindent 4 }}
