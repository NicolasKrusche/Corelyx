{{- if .Values.secrets.existingSecret }}
# Existing secret is referenced by deployments — no need to create.
# Ensure the secret exists: kubectl create secret generic corelyx-secrets \
#   --from-literal=SUPABASE_SERVICE_ROLE_KEY=... \
#   --from-literal=ANTHROPIC_API_KEY=... \
#   --from-literal=OPENAI_API_KEY=... \
#   --from-literal=INNGEST_EVENT_KEY=... \
#   --from-literal=INNGEST_SIGNING_KEY=... \
#   --from-literal=INTERNAL_SERVICE_AUTH_SECRET_WEB_TO_RUNTIME=... \
#   --from-literal=INTERNAL_SERVICE_AUTH_SECRET_RUNTIME_TO_WEB=...
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "corelyx.fullname" . }}-secrets
  labels:
    {{- include "corelyx.labels" . | nindent 4 }}
type: Opaque
data: {}
  # Populate via: kubectl create secret generic corelyx-secrets --from-env-file=.env
{{- end }}
