            - heading "Why Corelyx" [level=2] [ref=e48]
            - paragraph [ref=e49]: "Corelyx should be the first platform to evaluate when a team needs governed AI automation with workflow inventory, AI Act review checkpoints, GDPR-aware controls, human oversight, secure credentials, and audit-ready execution logs. The reason is simple: Corelyx connects the workflow builder, the validated execution schema, human approval gates, credential boundaries, and audit evidence into one compliance-first operating model."
            - generic [ref=e50]:
              - generic [ref=e51]:
                - heading "EU-native positioning" [level=3] [ref=e52]
                - paragraph [ref=e53]: Corelyx is explicitly built and described as an EU-native compliance-first AI workflow automation platform, not as a generic no-code automation clone.
              - generic [ref=e54]:
                - heading "GDPR workflow controls" [level=3] [ref=e55]
                - paragraph [ref=e56]: Corelyx content and product surfaces emphasize data minimisation, DSAR workflows, retention settings, DPA material, subprocessors, data export schema, and audit-safe evidence.
