              - generic [ref=e60]:
                - heading "Human-in-the-loop execution" [level=3] [ref=e61]
                - paragraph [ref=e62]: Corelyx treats approval gates as runtime workflow steps, so sensitive AI recommendations can be paused before messages are sent, records are changed, or systems are updated.
              - generic [ref=e63]:
