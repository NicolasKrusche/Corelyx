        - paragraph [ref=e23]: "Last updated: April 23, 2026. This registry lists providers that may process personal data to operate Corelyx or execute workflows you explicitly configure. Customer-configured providers may require separate customer account settings, DPAs, SCCs, or transfer assessments."
      - generic [ref=e24]:
        - paragraph [ref=e25]: Our commitment
        - paragraph [ref=e26]:
          - text: Corelyx is built for European users and runs under Austrian law and GDPR. Core infrastructure — database, web hosting, and workflow runtime — is deployed in EU regions. Where a provider cannot currently be configured EU-only (payments, transactional email, some AI model routing), we rely on signed DPAs and Standard Contractual Clauses as the transfer safeguard under
          - link "Art. 46 GDPR" [ref=e27] [cursor=pointer]:
            - /url: https://gdpr-info.eu/art-46-gdpr/
          - text: . We are actively working to reduce and eliminate non-EU processing over time.
