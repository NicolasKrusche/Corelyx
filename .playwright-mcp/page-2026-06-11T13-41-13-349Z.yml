        - generic [ref=e41]:
          - generic [ref=e42]:
            - heading "1. Overview" [level=2] [ref=e43]
            - generic [ref=e44]:
              - paragraph [ref=e45]: Corelyx is a visual AI automation platform. This policy explains how we process personal data when you create an account, configure workflows, connect third-party services, add model or API credentials, purchase a paid plan, or contact us about the product.
              - paragraph [ref=e46]: We do not sell personal data. We also do not load advertising trackers or non-essential analytics on the current site experience.
              - paragraph [ref=e47]: "This page separates:"
              - list [ref=e48]:
                - listitem [ref=e49]: core processors we engage to operate Corelyx itself, and
                - listitem [ref=e50]: optional connected services and model providers that only receive data when you explicitly enable them in a workflow.
          - generic [ref=e52]:
            - heading "2. Controller" [level=2] [ref=e53]
            - generic [ref=e54]:
              - paragraph [ref=e55]: The controller for the Corelyx service is Corelyx - sole-proprietor operation, incorporation pending.
              - paragraph [ref=e56]:
                - text: Full provider-identification details, including the current legal address and VAT information used for the public site, are published in the
                - link "Impressum" [ref=e57] [cursor=pointer]:
                  - /url: /impressum
                - text: .
          - generic [ref=e59]:
            - heading "3. Data Categories" [level=2] [ref=e60]
            - generic [ref=e61]:
              - generic [ref=e62]:
                - heading "Account and identity data" [level=3] [ref=e63]
                - paragraph [ref=e64]: Email address, password hash if you use password login, and if you use Google Sign-In, the profile data Google returns to us such as name, email, and avatar.
              - generic [ref=e65]:
                - heading "Program and workflow data" [level=3] [ref=e66]
                - paragraph [ref=e67]: Program schemas, prompts, node settings, execution modes, approvals, schedules, and version history you create inside Corelyx.
              - generic [ref=e68]:
                - heading "Run, approval, and operational data" [level=3] [ref=e69]
                - paragraph [ref=e70]: Run status, node execution state, timestamps, token and cost metadata, approval records, and application logs needed to operate and troubleshoot the service.
              - generic [ref=e71]:
                - heading "Connection and secret data" [level=3] [ref=e72]
                - paragraph [ref=e73]: Connection metadata plus encrypted OAuth tokens and API keys stored through Supabase Vault references so Corelyx can execute the integrations and model calls you configure.
              - generic [ref=e74]:
                - heading "Billing and plan data" [level=3] [ref=e75]
                - paragraph [ref=e76]: Plan tier, Stripe customer or subscription references, checkout events, and legally required billing records.
              - generic [ref=e77]:
                - heading "Workflow content (and possible special-category data)" [level=3] [ref=e78]
                - paragraph [ref=e79]: When you run a workflow, Corelyx processes the content it acts on — for example email bodies, documents, or form responses. That content can incidentally contain special categories of personal data under Art. 9 GDPR (e.g. health, religion, political opinions, or trade-union membership), because Corelyx cannot control what an incoming email or document says. Corelyx does not intentionally collect special-category data, does not use it to train any model, processes it only to perform the automation you configured, and stores execution logs in metadata-only form by default so content is not retained. Before the content of a workflow step is sent to an AI model, structured identifiers (email addresses, phone numbers, IBANs, IP addresses, payment card numbers) are redacted; free-text prose, including any special-category content within it, is not removed and is processed by the selected model provider. You remain responsible for having a lawful basis and, where required, an Art. 9(2) condition for the data you route through Corelyx, and should not route special-category data through the Corelyx platform key (which uses OpenRouter without a countersigned DPA — use your own EU-eligible model key instead).
          - generic [ref=e81]:
            - heading "4. Legal Bases" [level=2] [ref=e82]
            - generic [ref=e83]:
              - generic [ref=e84]:
                - heading "Art. 6(1)(b) GDPR - contract performance" [level=3] [ref=e85]
                - paragraph [ref=e86]: Used where processing is necessary to create your account, authenticate you, host the product, run your automations, send transactional notices, and provide billing or support you requested.
              - generic [ref=e87]:
                - heading "Art. 6(1)(c) GDPR - legal obligation" [level=3] [ref=e88]
                - paragraph [ref=e89]: Used where we must retain invoice, tax, accounting, or compliance records, or respond to valid legal requests.
              - generic [ref=e90]:
                - heading "Art. 6(1)(f) GDPR - legitimate interests" [level=3] [ref=e91]
                - paragraph [ref=e92]: Used for security monitoring, abuse prevention, incident response, backups, fraud prevention, and service reliability where those interests are not overridden by your rights.
