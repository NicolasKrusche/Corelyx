<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Corelyx</title>
    <style>
      :root { color-scheme: light dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #0c0c0d; color: #fafafa;
      }
      @media (prefers-color-scheme: light) { body { background: #ffffff; color: #18181b; } }
      .brand { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
      .sub { font-size: 13px; opacity: 0.6; }
      .spinner {
        width: 22px; height: 22px; border-radius: 50%;
        border: 2px solid currentColor; border-top-color: transparent;
        animation: spin 0.8s linear infinite; opacity: 0.5;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="brand">Corelyx</div>
    <div class="spinner"></div>
    <div class="sub">Connecting…</div>
    <!--
      This local page is only the bundled fallback. The window normally loads the
      hosted Corelyx web app (see tauri.conf.json → app.windows[0].url). Pairing
      happens automatically after the user logs in there (the web app's
      DesktopBridgeHandshake calls the `set_device_token` command).
    -->
  </body>
</html>
