[tool.poetry]
name = "flowos-runtime"
version = "0.1.0"
description = "FlowOS LangGraph execution runtime"
authors = ["FlowOS"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.139.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
langgraph = ">=1.2,<1.0"
langchain-core = "^1.4.0"
langchain-anthropic = "^1.4.0"
langchain-openai = "^1.3.0"
supabase = "^2.31.0"
httpx = "^0.28.0"
pydantic = "^2.7.0"
python-dotenv = "^1.0.0"
apscheduler = "^3.10.0"

[tool.poetry.dev-dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"

[tool.ruff]
target-version = "py311"
line-length = 120

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
